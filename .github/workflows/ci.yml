name: "CI"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  flake-check:
    name: "nix flake check"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Test/nix scratch must not depend on the image's /tmp. The runner
      # exports RUNNER_TEMP for exactly this purpose; publish it to the
      # remaining steps (job-level env cannot read the runner context).
      - name: "Use the runner temp dir for scratch"
        shell: bash
        run: |
          set -euo pipefail
          for name in TMPDIR TMP TEMP; do
            printf '%s=%s\n' "$name" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/determinate-nix-action@v3

      # Evaluate-only gate: the repository test suite below builds and runs the real artifacts, so avoid duplicating the build here.
      - name: "Check flake outputs"
        run: nix flake check --no-build -L --show-trace

  tests:
    name: "test suite"
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # Test/nix scratch must not depend on the image's /tmp. The runner
      # exports RUNNER_TEMP for exactly this purpose; publish it to the
      # remaining steps (job-level env cannot read the runner context).
      - name: "Use the runner temp dir for scratch"
        shell: bash
        run: |
          set -euo pipefail
          for name in TMPDIR TMP TEMP; do
            printf '%s=%s\n' "$name" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/determinate-nix-action@v3

      # The suites shell out to rg/sops/yq, which the runner image does not ship.
      - name: "Install test dependencies"
        shell: bash
        run: |
          set -euo pipefail
          nix profile install --accept-flake-config \
            nixpkgs#ripgrep \
            nixpkgs#jq \
            nixpkgs#gron \
            nixpkgs#sops \
            nixpkgs#yq
          printf '%s\n' "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      # The suites resolve sibling repositories as ../network-* (the developer
      # layout). Check them out at the revisions this repository pins so CI
      # matches a local checkout instead of missing them.
      - name: "Check out sibling repositories"
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(dirname "$GITHUB_WORKSPACE")"

          # flake.lock is gitignored in this repository, so generate it first to
          # learn the pinned revisions of the sibling inputs.
          if [ ! -f flake.lock ]; then
            nix flake lock
          fi

          nix eval --json --impure --expr '
            let
              l = builtins.fromJSON (builtins.readFile ./flake.lock);
              root = l.nodes.root.inputs or { };
              describe = nodeName:
                let n = l.nodes.${nodeName}.locked or { };
                in { type = n.type or ""; owner = n.owner or ""; repo = n.repo or ""; rev = n.rev or ""; };
            in builtins.mapAttrs (name: nodeName: describe nodeName) root
          ' > "$RUNNER_TEMP/inputs.json"

          jq -r 'to_entries[] | select(.value.type == "github" and .value.owner == "esp0xdeadbeef")
                 | [.key, .value.repo, .value.rev] | @tsv' "$RUNNER_TEMP/inputs.json" \
            > "$RUNNER_TEMP/siblings.tsv"

          while IFS=$'\t' read -r name repo rev; do
            [ -e "${workspace}/${name}" ] && continue
            echo "::group::${name} @ ${rev:0:10}"
            git init --quiet "${workspace}/${name}"
            git -C "${workspace}/${name}" remote add origin "https://github.com/esp0xdeadbeef/${repo}.git"
            git -C "${workspace}/${name}" fetch --quiet --depth 1 origin "${rev}"
            git -C "${workspace}/${name}" checkout --quiet FETCH_HEAD
            echo "::endgroup::"
          done < "$RUNNER_TEMP/siblings.tsv"

          # `nixos` is not a flake input of this repository, so it is absent from
          # siblings.tsv, but several FS rows read the intent/inventory fixtures
          # under prod-network/testing of that checkout via NIXOS_SRC. Defaulting
          # NIXOS_SRC to a developer home directory made every such row fail with
          # "no ... fixture at /home/runner/github/nixos/...".
          #
          # Pin the revision: fetching `main` would make CI depend on whatever
          # that repository happened to hold at run time, so a red run could not
          # be reproduced and a green run could not be trusted. Bump this rev
          # deliberately, in the same change that needs a newer fixture.
          nixos_rev="f2b80249fedc0821b2ddc3c4bd74ea804674287a"
          if [ ! -e "${workspace}/nixos" ]; then
            echo "::group::nixos @ ${nixos_rev:0:10}"
            git init --quiet "${workspace}/nixos"
            git -C "${workspace}/nixos" remote add origin "https://github.com/esp0xdeadbeef/nixos.git"
            git -C "${workspace}/nixos" fetch --quiet --depth 1 origin "${nixos_rev}"
            git -C "${workspace}/nixos" checkout --quiet FETCH_HEAD
            echo "::endgroup::"
          fi

          # Suites default these to a developer home directory; point them at the
          # sibling checkouts instead.
          {
            printf 'NIXOS_SRC=%s\n'                "${workspace}/nixos"
            printf 'NETWORK_LABS_PATH=%s\n'        "${workspace}/network-labs"
            printf 'NETWORK_LABS_ROOT=%s\n'        "${workspace}/network-labs"
            printf 'NETWORK_LABS_REPO=%s\n'        "${workspace}/network-labs"
            printf 'NETWORK_CPM_PATH=%s\n'         "${workspace}/network-control-plane-model"
            printf 'NETWORK_NFM_PATH=%s\n'         "${workspace}/network-forwarding-model"
            printf 'NETWORK_COMPILER_PATH=%s\n'    "${workspace}/network-compiler"
            printf 'NETWORK_RENDERER_NIXOS_PATH=%s\n' "${workspace}/network-renderer-nixos"
            printf 'NETWORK_RENDERER_CLAB_PATH=%s\n'  "${workspace}/network-renderer-containerlab-linux-backend"
            printf 'NETWORK_RENDERER_WIREGUARD_PATH=%s\n' "${workspace}/network-renderer-wireguard"
            printf 'NETWORK_RENDERER_NEBULA_PATH=%s\n'    "${workspace}/network-renderer-nebula"
            printf 'NETWORK_RENDERER_ACCESS_ENDPOINT_NIXOS_PATH=%s\n' "${workspace}/network-renderer-access-endpoint-nixos"
          } >> "$GITHUB_ENV"

      - name: "Run repository test suite"
        env:
          NETWORK_REPO_DIRECT_TEST_OK: "1"
        run: ./run-all-tests.sh
